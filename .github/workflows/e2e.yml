name: Android E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Android-ChatApp
        uses: actions/checkout@v4
        with:
          path: Android-ChatApp
          persist-credentials: false

      - name: Checkout KMP-ChatBackend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/KMP-ChatBackend
          path: KMP-ChatBackend
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Tier 3 E2E verification suite on AVD
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          E2E_BACKEND_DIR: ${{ github.workspace }}/KMP-ChatBackend
          CI: 'true'
        with:
          api-level: 36
          arch: x86_64
          profile: medium_phone
          emulator-options: -no-snapshot-load -no-audio -no-boot-anim -no-window -gpu swiftshader_indirect
          working-directory: Android-ChatApp
          script: bash ./scripts/e2e/verify.sh --teardown

      - name: Upload E2E failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics
          path: Android-ChatApp/build/reports/e2e/
          if-no-files-found: warn
          retention-days: 14
